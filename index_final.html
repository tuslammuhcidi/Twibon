const C={blue:'#174a8b',navy:'#12315a',yellow:'#ffd34e',orange:'#ff8a3d',pink:'#ff6fae',cyan:'#55c7e8',green:'#77c66e',purple:'#8267c7',cream:'#fff9ec',white:'#fff'};
function roundRect(x,y,w,h,r,fill,stroke,lw=1){ctx.beginPath();ctx.roundRect(x,y,w,h,r);if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}}
function star(cx,cy,r,c){ctx.save();ctx.translate(cx,cy);ctx.beginPath();for(let i=0;i<10;i++){let a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:r*.45;ctx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}ctx.closePath();ctx.fillStyle=c;ctx.fill();ctx.restore()}
function cloud(x,y,s,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,s*.28,0,7);ctx.arc(x+s*.28,y-s*.12,s*.30,0,7);ctx.arc(x+s*.58,y,s*.34,0,7);ctx.fill()}
function balloon(x,y,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,28,38,0,0,7);ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(x,y+38);ctx.quadraticCurveTo(x+23,y+70,x+6,y+115);ctx.stroke()}
function fitText(txt,max,size){ctx.font=`900 ${size}px Arial`;while(ctx.measureText(txt).width>max&&size>25){size--;ctx.font=`900 ${size}px Arial`}return size}
function draw(){ctx.clearRect(0,0,1080,1350);ctx.fillStyle=C.cream;ctx.fillRect(0,0,1080,1350);ctx.fillStyle='#e9f6ff';ctx.beginPath();ctx.arc(970,520,230,0,7);ctx.fill();ctx.fillStyle='#fff0c7';ctx.beginPath();ctx.arc(80,950,220,0,7);ctx.fill();
// top bands
ctx.fillStyle=C.blue;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1080,0);ctx.lineTo(1080,155);ctx.lineTo(0,220);ctx.closePath();ctx.fill();ctx.fillStyle=C.yellow;ctx.beginPath();ctx.moveTo(0,185);ctx.lineTo(1080,120);ctx.lineTo(1080,155);ctx.lineTo(0,220);ctx.fill();
// logo
ctx.fillStyle=C.white;ctx.strokeStyle=C.yellow;ctx.lineWidth=7;ctx.beginPath();ctx.arc(540,105,92,0,7);ctx.fill();ctx.stroke();ctx.save();ctx.beginPath();ctx.arc(540,105,82,0,7);ctx.clip();if(logo.complete){const lw=logo.width||1,lh=logo.height||1;const scale=Math.min(158/lw,158/lh);const w=lw*scale,h=lh*scale;ctx.drawImage(logo,540-w/2,105-h/2,w,h);}ctx.restore();
// title
ctx.textAlign='center';ctx.fillStyle=C.navy;ctx.font='900 58px Arial';ctx.fillText('PORTOFOLIO SISWA',540,292);roundRect(235,317,610,62,31,C.yellow,C.orange,4);ctx.fillStyle=C.navy;ctx.font='900 27px Arial';ctx.fillText('TAHUN AJARAN 2026/2027',540,358);
// decorations
cloud(110,440,100,C.white);cloud(850,455,100,C.white);balloon(55,610,C.pink);balloon(1025,625,C.orange);star(118,385,34,C.green);star(957,390,34,C.purple);star(115,890,30,C.orange);star(965,900,30,C.cyan);
// rainbow
[[C.pink,350],[C.orange,330],[C.yellow,310],[C.green,290],[C.cyan,270],[C.purple,250]].forEach(([c,r])=>{ctx.strokeStyle=c;ctx.lineWidth=20;ctx.beginPath();ctx.arc(540,600,r,Math.PI,0);ctx.stroke()});
// photo circle
const cx=540,cy=670,rad=300;ctx.save();ctx.beginPath();ctx.arc(cx,cy,rad-18,0,7);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(cx-rad,cy-rad,rad*2,rad*2);if(photo&&photo.complete){const z=+zoomEl.value,base=Math.max((rad*2)/photo.width,(rad*2)/photo.height),w=photo.width*base*z,h=photo.height*base*z,x=cx-w/2+(+xEl.value),y=cy-h/2+(+yEl.value);ctx.drawImage(photo,x,y,w,h)}ctx.restore();ctx.lineWidth=26;ctx.strokeStyle=C.yellow;ctx.beginPath();ctx.arc(cx,cy,rad,0,7);ctx.stroke();ctx.lineWidth=10;ctx.strokeStyle=C.blue;ctx.beginPath();ctx.arc(cx,cy,rad-20,0,7);ctx.stroke();
// blocks
[['A',70,920,C.pink],['B',155,900,C.cyan],['C',850,900,C.green],['D',935,920,C.orange]].forEach(([t,x,y,c])=>{roundRect(x,y,72,72,13,c,C.white,4);ctx.fillStyle=C.white;ctx.font='900 42px Arial';ctx.fillText(t,x+36,y+51)});
// Name banner
roundRect(80,1010,920,145,28,C.blue,C.yellow,8);let nm=(nameEl.value||'NAMA SISWA').toUpperCase();ctx.fillStyle=C.white;ctx.font=`900 ${fitText(nm,840,56)}px Arial`;ctx.fillText(nm,540,1075);ctx.fillStyle=C.yellow;ctx.font='900 31px Arial';ctx.fillText((groupEl.value||'KELOMPOK PAKUAN').toUpperCase(),540,1122);
// footer
roundRect(45,1183,990,125,26,C.white,C.cyan,6);ctx.fillStyle=C.blue;ctx.font='900 29px Arial';ctx.fillText('RA BABUSSALAM AL ISLAMI',540,1227);ctx.fillStyle=C.navy;ctx.font='700 18px Arial';ctx.fillText('JL. PONDOK MEKAR INDAH 1 • WANCIMEKAR • KOTABARU • KARAWANG',540,1260);ctx.font='700 17px Arial';ctx.fillText('NSM 101232150109  |  TLP 081383133283',540,1288);
// confetti
[[35,300,C.pink],[1030,300,C.green],[40,1120,C.yellow],[1040,1110,C.purple]].forEach(([x,y,c])=>{ctx.strokeStyle=c;ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(x-18,y);ctx.lineTo(x+18,y);ctx.moveTo(x,y-18);ctx.lineTo(x,y+18);ctx.stroke()})}
[logo,sample].forEach(i=>i.onload=draw);[nameEl,groupEl,zoomEl,xEl,yEl].forEach(e=>e.addEventListener('input',draw));
document.getElementById('file').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/')){status.textContent='File harus berupa gambar.';return}const im=new Image();im.onload=()=>{photo=im;zoomEl.value=1;xEl.value=0;yEl.value=0;status.textContent='Foto berhasil dimuat.';draw()};im.src=URL.createObjectURL(f)});
document.getElementById('download').onclick=()=>{draw();const a=document.createElement('a');const safe=(nameEl.value||'siswa').trim().replace(/[^a-z0-9]+/gi,'_');a.download=`Twibbon_${safe}_Kelompok_Pakuan.jpg`;a.href=cv.toDataURL('image/jpeg',.95);a.click();status.textContent='JPG berhasil dibuat.'};
document.getElementById('reset').onclick=()=>{zoomEl.value=1;xEl.value=0;yEl.value=0;draw()};document.getElementById('sample').onclick=()=>{photo=sample;zoomEl.value=1;xEl.value=0;yEl.value=0;draw()};
function pos(e){const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:(p.clientX-r.left)*cv.width/r.width,y:(p.clientY-r.top)*cv.height/r.height}}
function down(e){const p=pos(e);if(Math.hypot(p.x-540,p.y-670)<300){drag=true;last=p;e.preventDefault()}}function move(e){if(!drag)return;const p=pos(e);xEl.value=Math.max(-350,Math.min(350,+xEl.value+p.x-last.x));yEl.value=Math.max(-350,Math.min(350,+yEl.value+p.y-last.y));last=p;draw();e.preventDefault()}function up(){drag=false}cv.addEventListener('mousedown',down);cv.addEventListener('mousemove',move);window.addEventListener('mouseup',up);cv.addEventListener('touchstart',down,{passive:false});cv.addEventListener('touchmove',move,{passive:false});window.addEventListener('touchend',up);draw();
